name: CI — Test & Lint

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Run test suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run pytest
        env:
          SECRET_KEY: ci-test-secret-key-not-for-production
          DATABASE_PATH: /tmp/ci_test.db
          UPLOAD_FOLDER: /tmp/ci_uploads
          STORAGE_BACKEND: local
        run: pytest -v --tb=short

      - name: Verify the app imports cleanly
        env:
          SECRET_KEY: ci-test-secret-key-not-for-production
          DATABASE_PATH: /tmp/ci_import.db
          UPLOAD_FOLDER: /tmp/ci_uploads_2
        run: python -c "from backend.app import create_app; app = create_app(); print('App factory OK')"