<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Profile — Hobby &amp; Skills Tracker</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <main class="container page">
    <h1 style="font-size:1.5rem" class="mb-2">My Profile</h1>
    <div id="alertBox"></div>

    <div class="grid grid-2">
      <!-- PROFILE CARD -->
      <div class="card">
        <div class="flex mb-2" style="gap:18px">
          <div id="profileAvatar"></div>
          <div>
            <h2 style="margin:0" id="profileName">…</h2>
            <p style="color:var(--text-muted);font-size:.88rem" id="profileUsername"></p>
            <p style="color:var(--text-muted);font-size:.82rem" id="profileEmail"></p>
          </div>
        </div>

        <div class="grid grid-3 mb-2">
          <div class="stat-card card" style="box-shadow:none">
            <div class="stat-value" id="statSkills">–</div>
            <div class="stat-label">Skills</div>
          </div>
          <div class="stat-card card" style="box-shadow:none">
            <div class="stat-value" id="statPosts">–</div>
            <div class="stat-label">Posts</div>
          </div>
          <div class="stat-card card" style="box-shadow:none">
            <div class="stat-value" id="statHours">–</div>
            <div class="stat-label">Hours</div>
          </div>
        </div>

        <h3>Upload Profile Picture</h3>
        <div class="flex">
          <input type="file" id="avatarInput" accept="image/*" />
          <button class="btn btn-primary btn-sm" id="uploadAvatar">Upload</button>
        </div>
      </div>

      <!-- EDIT FORM -->
      <div class="card">
        <h2>Edit Profile</h2>
        <form id="profileForm">
          <div class="form-group">
            <label>Full Name</label>
            <input id="editName" required />
          </div>
          <div class="form-group">
            <label>Bio</label>
            <textarea id="editBio" maxlength="500"
              placeholder="Tell the community what you're learning…"></textarea>
          </div>
          <div class="form-group">
            <label>Interests (comma separated)</label>
            <input id="editInterests" placeholder="Guitar, Photography, Chess" />
          </div>
          <button type="submit" class="btn btn-primary btn-block">Save Changes</button>
        </form>
      </div>
    </div>
  </main>

  <script src="/js/api.js"></script>
  <script src="/js/nav.js"></script>
  <script src="/js/profile.js"></script>
</body>
</html>
